<!doctype html>
<html lang="pt-BR" data-loja="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Botané Deli e Café — Reservas</title>
<meta name="description" content="Reserve uma mesa, veja os cardápios e fale com a gente.">
<meta name="theme-color" content="#3C4A3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Karla:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ===========================================================================
   O site do CLIENTE — reserva.botanedeliecafe.com.br
   ---------------------------------------------------------------------------
   🔑 **Pedido do dono (21/09/2026):** *"deixa mais próximo ao protótipo que foi
   proposto em `apresentacao/reservas-prototipo.html`, utilizando a logo
   cadastrada, os catálogos colocar tudo na página inicial, no estilo
   apresentado, e ao clicar no botão, abrir o catálogo."*

   ⚠️ **A identidade é a do PROTÓTIPO, linha a linha**: a capa de 128px com os
   dois gradientes radiais sobre o oliva, o medalhão redondo de 92px descendo
   34px por cima dela, a tarja de estado no canto, e a lista de `.item` com
   ícone à esquerda e subtítulo embaixo. As fontes são as de lá — Fraunces para
   os títulos, Karla para o corpo, DM Mono para as miudezas.

   🔑 **Os catálogos são ITENS DA PÁGINA INICIAL**, um por cardápio, e clicar
   abre o PDF. Era uma tela separada com uma lista dentro; o protótipo já os
   mostrava no hub, e é o que o dono pediu de volta.

   ⚠️ **Nada de build.** São duas telas que leem a API — um arquivo que abre
   direto carrega mais rápido no celular de quem está na rua do que qualquer
   bundle, e publica como site estático.
   =========================================================================== */
:root {
  --papel: #F3EFE4;
  --superficie: #FBF9F3;
  --superficie-2: #F7F3E9;
  --tinta: #1B211C;
  --tinta-suave: #5E6659;
  --linha: #E0D8C6;
  --erva: #3C4A3E;
  --ocre-claro: #F6EDD8;
  --barro: #9A3B2E;
  --sombra: 0 1px 2px rgba(27,33,28,.05), 0 10px 30px rgba(27,33,28,.08);
  --raio: 13px;
}
/* ⚠️ O tema escuro vem do APARELHO: quem reserva às 22h está com o celular no
   escuro. Só os tokens mudam — os componentes leem sempre daqui. */
@media (prefers-color-scheme: dark) {
  :root {
    --papel: #12160F; --superficie: #1A1F18; --superficie-2: #202619;
    --tinta: #EDE7D8; --tinta-suave: #9AA394; --linha: #2C3328;
    --ocre-claro: #2A2517;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--papel);
  color: var(--tinta);
  font: 400 15px/1.45 Karla, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* O cartão central, como no protótipo: o site é um folheto, não uma página. */
.folha {
  max-width: 440px; margin: 0 auto; min-height: 100dvh;
  background: var(--superficie); box-shadow: var(--sombra); overflow: hidden;
}
@media (min-width: 480px) {
  body { padding: 24px 16px; }
  .folha { min-height: 0; border: 1px solid var(--linha); border-radius: 18px; }
}

/* ---- a capa ---- */
.capa {
  position: relative; height: 128px;
  background:
    radial-gradient(120% 90% at 30% 20%, #D8C9A8 0%, transparent 60%),
    radial-gradient(110% 90% at 80% 30%, #B7C3A6 0%, transparent 55%),
    linear-gradient(160deg, #6D7A5C, var(--erva));
}
/* 🔑 O medalhão: 92px, redondo, descendo 34px por cima da capa — é a marca da
   casa pousando na dobra. Com logo cadastrada ele vira a imagem; sem ela,
   desenha o nome, como o protótipo. */
.marca {
  position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%);
  width: 92px; height: 92px; border-radius: 50%; background: var(--erva);
  display: grid; place-content: center; text-align: center; color: #F3EFE4;
  border: 3px solid var(--superficie); overflow: hidden;
}
.marca b { display: block; font: 300 21px/1 Fraunces, Georgia, serif; }
.marca span {
  font: 400 8px/1.4 "DM Mono", monospace; letter-spacing: .18em;
  text-transform: uppercase; opacity: .8;
}
.marca img { width: 100%; height: 100%; object-fit: cover; display: block; }
.estado {
  position: absolute; right: 10px; top: 10px; border-radius: 999px;
  padding: 5px 10px; font: 500 11px/1 Karla, sans-serif;
  background: rgba(20,26,22,.72); color: #F1EDE2;
}

/* ---- o corpo ---- */
.corpo { padding: 46px 20px 26px; display: flex; flex-direction: column; gap: 14px; }
.corpo h2 { font: 400 22px/1.2 Fraunces, Georgia, serif; margin: 0; text-align: center; }
.sub { margin: 0; text-align: center; color: var(--tinta-suave); font-size: 14px; }
.rot { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }

.itens { display: flex; flex-direction: column; gap: 9px; }
/* 🔑 **Texto CENTRALIZADO e só o necessário** (pedido do dono, 21/09/2026:
   *"nos botões, colocar centralizado o texto, e somente o texto necessário,
   exemplo: Reserve sua Mesa, Catálogo Y, Entre em Contato"*).
   ⚠️ **O ícone e a seta saíram junto, e não por descuido.** Um ícone à esquerda
   ancora o texto à esquerda: centralizar com ele no lugar deixaria o rótulo
   torto em relação ao botão. E o subtítulo — "leva menos de um minuto",
   "abrir o PDF" — era exatamente o texto que não era necessário. */
.item {
  display: flex; align-items: center; justify-content: center;
  width: 100%; text-align: center;
  background: var(--superficie-2); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: 15px 16px;
  font: 500 16px/1.25 Karla, sans-serif; color: var(--tinta);
  cursor: pointer; text-decoration: none;
  /* ⚠️ Alvo de dedo: quem usa este site está no celular, quase sempre andando. */
  min-height: 52px;
}
.item:hover { border-color: var(--erva); }
.item:focus-visible { outline: 2px solid var(--erva); outline-offset: 2px; }
.item.destaque { background: var(--erva); border-color: var(--erva); color: #F4F0E5; }

/* ⚠️ **`display` explícito VENCE o `[hidden]` do navegador**, e era um defeito
   calado: `.regras` é flex, então toda caixa de aviso com `hidden` continuava
   ocupando espaço — uma moldura vazia sob o botão de confirmar, sem texto e sem
   explicação. Vale para `.itens`, `.horarios` e `.dupla` pela mesma razão. */
[hidden] { display: none !important; }

.regras {
  background: var(--ocre-claro); border: 1px solid var(--linha);
  border-radius: var(--raio); padding: 12px 14px; font-size: 13px;
  display: flex; flex-direction: column; gap: 6px; color: var(--tinta-suave);
}
.regras b { color: var(--tinta); }
.regras.ruim { background: transparent; border-left: 3px solid var(--barro); border-radius: 0 var(--raio) var(--raio) 0; }

label.campo { display: block; font-size: 13px; color: var(--tinta-suave); }
label.campo input {
  width: 100%; font: 400 15px/1.3 Karla, sans-serif; color: var(--tinta);
  background: var(--superficie); border: 1px solid var(--linha);
  border-radius: 10px; padding: 10px 11px; margin-top: 5px;
}
label.campo input:focus-visible { outline: 2px solid var(--erva); outline-offset: 1px; }
/* O seletor de gênero usa a mesma caixa dos campos de texto: um <select> com a
   cara do navegador ao lado de um <input> desenhado parece defeito. */
label.campo select {
  width: 100%; font: 400 15px/1.3 Karla, sans-serif; color: var(--tinta);
  background: var(--superficie); border: 1px solid var(--linha);
  border-radius: 10px; padding: 10px 11px; margin-top: 5px; min-height: 43px;
}
label.campo select:focus-visible { outline: 2px solid var(--erva); outline-offset: 1px; }
.dupla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* ⚠️ Gênero e cidade lado a lado ficam apertados a 400px — e é onde este site
   é lido. Abaixo de 420px eles empilham. */
@media (max-width: 419px) { .dupla { grid-template-columns: 1fr; } }
.passos { display: flex; flex-direction: column; gap: 12px; }
.sub-tela { color: var(--tinta-suave); font-size: 14px; margin: -2px 0 2px; }
/* A tela de "pronto": o que a casa guardou, em linha, para conferir de relance. */
.recibo { display: flex; flex-direction: column; gap: 2px; text-align: center; }
.recibo b { font: 600 22px/1.2 Fraunces, Georgia, serif; }

.horarios { display: flex; flex-wrap: wrap; gap: 8px; }
.hora {
  min-height: 44px; min-width: 76px; padding: 8px 14px;
  background: var(--superficie); border: 1px solid var(--linha); border-radius: 10px;
  font: 500 15px/1 "DM Mono", monospace; cursor: pointer; color: inherit;
}
.hora:hover { border-color: var(--erva); }
.hora[aria-pressed="true"] { background: var(--erva); border-color: var(--erva); color: #F4F0E5; }

.voltar {
  background: none; border: 0; color: var(--tinta-suave); cursor: pointer;
  font: 500 13px/1 Karla, sans-serif; padding: 4px 0; align-self: flex-start;
}
.voltar:hover { color: var(--tinta); }
.vazio { color: var(--tinta-suave); font-size: 14px; }
/* Os dados de contato: rótulo em cima, valor embaixo. Não são botões. */
.dado { margin: 0; padding: 10px 2px; border-bottom: 1px solid var(--linha); }
.dado span {
  display: block; font: 500 11px/1.4 "DM Mono", monospace; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tinta-suave);
}
.dado a { color: inherit; }
.pe {
  text-align: center; color: var(--tinta-suave);
  font: 400 11.5px/1.6 "DM Mono", monospace; padding: 4px 0 2px;
}
.tela { display: none; }
.tela[data-ativa] { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<div class="folha">

  <header class="capa">
    <span class="estado" id="estado">…</span>
    <div class="marca" id="marca"><b>Botané</b><span>comida de raiz</span></div>
  </header>

  <div class="corpo">

    <!-- ================= a página inicial ================= -->
    <section class="tela" data-tela="inicio" data-ativa>
      <h2 id="nome-da-casa">Botané Deli e Café</h2>
      <p class="sub" id="linha-dias">…</p>
      <div class="itens" id="itens">
        <button class="item destaque" id="ir-reservar">Reserve sua Mesa</button>
        <!-- 🔑 Os catálogos entram AQUI, um por cardápio, e cada um abre o PDF.
             Quem os monta é o `carregarCatalogos()`. -->
      </div>
    </section>

    <!-- ================= reservar ================= -->
    <!-- ================= quem reserva ================= -->
    <!-- 🔑 **Pedido do dono (21/09/2026):** *"clica em Reserve sua Mesa, abre uma
         tela com o número do telefone; caso não tenha cadastrada, realiza o
         cadastro com Nome, telefone, gênero e cidade."*
         ⚠️ **O telefone vem PRIMEIRO, e sozinho.** Mostrar os quatro campos de
         uma vez faria quem já é cliente preencher tudo de novo para descobrir
         que já era conhecido. -->
    <section class="tela" data-tela="quem" aria-labelledby="t-quem">
      <button class="voltar" data-ir="inicio">‹ voltar</button>
      <h2 id="t-quem">Reserve sua mesa</h2>
      <p class="sub-tela">Comece pelo telefone — é assim que a casa reconhece você.</p>
      <div class="passos">
        <label class="campo" for="fone">Seu telefone, com DDD
          <input id="fone" type="tel" inputmode="tel" autocomplete="tel"
                 placeholder="(47) 99910-5033">
        </label>

        <div id="bloco-quem" hidden>
          <label class="campo" for="nome-cliente">Seu nome
            <input id="nome-cliente" autocomplete="name" maxlength="120">
          </label>
        </div>

        <!-- ⚠️ Gênero e cidade só aparecem para quem NÃO tem cadastro, e só se a
             casa pedir cadastro completo (`reserva_config.cadastro_completo`). -->
        <div id="bloco-novo" hidden>
          <div class="dupla">
            <label class="campo" for="genero">Gênero
              <select id="genero">
                <option value="">escolha…</option>
                <option value="FEMININO">Feminino</option>
                <option value="MASCULINO">Masculino</option>
                <option value="OUTRO">Outro</option>
                <option value="NAO_INFORMADO">Prefiro não informar</option>
              </select>
            </label>
            <label class="campo" for="cidade">Cidade
              <input id="cidade" autocomplete="address-level2" maxlength="80">
            </label>
          </div>
        </div>

        <div class="regras" id="aviso-quem" hidden></div>
        <button class="item destaque" id="avancar">Continuar</button>
      </div>
    </section>

    <section class="tela" data-tela="reserva" aria-labelledby="t-reserva">
      <!-- ⚠️ O voltar depende de por onde a pessoa ENTROU: com reserva online
           ela veio da identificação; sem, veio da capa. Um alvo fixo mandaria
           metade dos visitantes para uma tela que eles nunca viram. -->
      <button class="voltar" id="voltar-reserva" data-ir="inicio">‹ voltar</button>
      <h2 id="t-reserva">Reservar uma mesa</h2>
      <!-- 🔑 **As pessoas vêm ANTES do horário, e a ordem é a regra.**
           "Esgotado" depende do tamanho do grupo: às 19h pode não haver mesa
           para 6 e haver para 2. Perguntar o horário primeiro faria a tela
           prometer o que o salão não tem. -->
      <div class="dupla">
        <label class="campo">Quantas pessoas
          <input id="pessoas" type="number" inputmode="numeric" min="1" max="20" value="2">
        </label>
        <label class="campo">Que dia
          <input id="dia" type="date">
        </label>
      </div>
      <div>
        <span class="rot">Horários com mesa</span>
        <div class="horarios" id="horarios" role="group" aria-label="horários disponíveis">
          <span class="vazio">Escolha o dia e quantas pessoas.</span>
        </div>
      </div>
      <div class="regras" id="aviso-reserva" hidden></div>
      <button class="item destaque" id="confirmar" hidden>Confirmar reserva</button>
      <div class="regras" id="rodape-reserva" hidden></div>
    </section>

    <!-- ================= pronto ================= -->
    <!-- ⚠️ **Esta tela só existe porque a reserva agora GRAVA.** Enquanto o site
         apenas abria o WhatsApp, dizer "reservado" faria o cliente aparecer na
         porta sem mesa. Agora há mesa — e o texto muda conforme a casa confirme
         na hora ou vá olhar depois. -->
    <section class="tela" data-tela="pronto" aria-labelledby="t-pronto">
      <h2 id="t-pronto">Pronto!</h2>
      <div class="recibo" id="recibo"></div>
      <div class="regras" id="aviso-pronto"></div>
      <button class="item" data-ir="inicio">Voltar ao início</button>
    </section>

    <!-- ================= contato ================= -->
    <section class="tela" data-tela="contato" aria-labelledby="t-contato">
      <button class="voltar" data-ir="inicio">‹ voltar</button>
      <h2 id="t-contato">Entre em contato</h2>
      <div class="itens" id="bloco-contato"></div>
    </section>

    <p class="pe" id="rodape"></p>
  </div>
</div>

<script>
/* ===========================================================================
   ⚠️ **A API é a MESMA do sistema interno.** Não há backend próprio: as rotas
   `/publico/...` existem para isso, e a regra de disponibilidade é a que a
   agenda do balcão usa — uma segunda regra aqui divergiria, e a divergência
   apareceria como mesa prometida ao cliente e não disponível na casa.

   ⚠️ **O endereço é decidido pelo HOSPEDEIRO**, não escrito no código.
   =========================================================================== */
const API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "http://127.0.0.1:9200"
  : "https://sistema.botanedeliecafe.com.br/api";

/* A loja sai do `<html data-loja>`: no dia em que houver duas casas com
   reserva, cada uma publica o seu com o número dela — sem tocar no código. */
const LOJA = document.documentElement.dataset.loja || "1";

const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[<>&"]/g,
  (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

/**
 * Uma chamada à API pública. Sem `corpo` é GET; com `corpo`, POST.
 *
 * ⚠️ **O erro carrega a FRASE do servidor**, não só o número. É o servidor que
 * sabe dizer "falta o DDD", "esse horário acabou de ser tomado" ou "muitas
 * tentativas em pouco tempo" — e era isso que se perdia quando o erro era só o
 * código de status. A tela mostrando "500" não ajuda ninguém a reservar.
 * ⚠️ **Telefone e nome vão no CORPO, nunca na URL.** Dado pessoal em query
 * string entra em log de servidor, em histórico de navegador e no `Referer` de
 * qualquer coisa que a página carregue depois.
 */
async function pedir(rota, corpo) {
  const r = await fetch(`${API}/publico/${LOJA}${rota}`, corpo === undefined ? undefined : {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corpo),
  });
  if (!r.ok) {
    let frase = "";
    try {
      const erro = await r.json();
      // O FastAPI devolve `detail` como texto, ou como lista quando é o
      // Pydantic que recusou — nesse caso a primeira mensagem serve.
      frase = typeof erro.detail === "string"
        ? erro.detail
        : (erro.detail && erro.detail[0] && erro.detail[0].msg) || "";
    } catch { /* resposta sem corpo: fica só o número */ }
    const e = new Error(String(r.status));
    e.status = r.status;
    e.mensagem = frase;
    throw e;
  }
  return r.json();
}

function ir(nome) {
  document.querySelectorAll(".tela").forEach((t) => {
    if (t.dataset.tela === nome) t.setAttribute("data-ativa", "");
    else t.removeAttribute("data-ativa");
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
  // ⚠️ O botão de VOLTAR do celular precisa funcionar: sem isto, quem está na
  // reserva e volta sai do site em vez de ir para o início.
  if (location.hash !== "#" + nome) history.pushState({ tela: nome }, "", "#" + nome);
}
document.addEventListener("click", (e) => {
  const alvo = e.target.closest("[data-ir]");
  if (!alvo) return;
  e.preventDefault();
  ir(alvo.dataset.ir);
});
window.addEventListener("popstate", () => ir((location.hash || "#inicio").slice(1)));

/* ---- quem é a casa ---- */
let casa = null;

/**
 * 🔑 **O texto da mensagem vem da CONFIGURAÇÃO da casa** (migração 081, pedido
 * do dono): Reservas ▸ Configurações ▸ "A mensagem que abre no WhatsApp".
 * Estava escrito aqui, e texto que o cliente lê escrito em código só muda
 * quando alguém publica.
 *
 * ⚠️ **Os marcadores são trocados AQUI**, no instante do clique: `{pessoas}`,
 * `{data}` e `{hora}` só existem depois de a pessoa escolher, e o servidor não
 * sabe o que ela escolheu.
 * ⚠️ **O padrão continua no site**, para o caso de a casa apagar o campo: um
 * WhatsApp que abre com a caixa em branco é pior que um texto genérico.
 */
function mensagem(modelo, padrao, valores = {}) {
  const base = (modelo || "").trim() || padrao;
  return base.replace(/\{(\w+)\}/g, (inteiro, chave) =>
    chave in valores ? String(valores[chave]) : inteiro);
}

function linkZap(texto) {
  return casa && casa.whatsapp
    ? `https://wa.me/${casa.whatsapp}?text=${encodeURIComponent(texto)}`
    : null;
}

/** A mensagem de quem só quer falar com a casa. */
function zapDeContato() {
  return linkZap(mensagem(
    casa && casa.zap_texto,
    `Olá! Vim pelo site do ${casa ? casa.casa : "Botané"}.`,
    { casa: casa ? casa.casa : "Botané" }));
}

async function carregarCasa() {
  try {
    casa = await pedir("/casa");
  } catch {
    $("#linha-dias").textContent = "Não conseguimos carregar agora. Tente em instantes.";
    $("#estado").hidden = true;
    return;
  }
  $("#nome-da-casa").textContent = casa.casa;
  document.title = `${casa.casa} — Reservas`;

  // 🔑 **A logo CADASTRADA** (pedido do dono). Sem ela, o medalhão desenha o
  // nome da casa, como o protótipo — inventar uma imagem seria pior.
  if (casa.logo_url) {
    $("#marca").innerHTML =
      `<img src="${API}${esc(casa.logo_url)}" alt="${esc(casa.casa)}">`;
  } else {
    const primeiro = (casa.casa || "Botané").split(" ")[0];
    $("#marca").innerHTML = `<b>${esc(primeiro)}</b><span>deli e café</span>`;
  }
  // ⚠️ **A capa NÃO usa `empresa.cor_primaria`, e isso foi medido na tela.** A
  // cor cadastrada é #149445 — um verde vivo, que o sistema interno usa como
  // acento sobre fundo claro. Chapada numa capa de 128px ela briga com o
  // medalhão escuro e afasta o site justamente do protótipo, que é terroso
  // (oliva sobre areia). O pedido foi chegar PERTO do protótipo; o gradiente
  // dele fica.

  // ⚠️ **"Fechado" sozinho é uma porta na cara.** A tarja diz quando abre.
  $("#estado").textContent = casa.aberta_agora
    ? "Aberto agora"
    : casa.proximo ? `Fechado · abre ${casa.proximo}` : "Fechado hoje";
  $("#linha-dias").textContent = (casa.dias || []).length
    ? casa.dias.join(" · ") + (casa.hoje ? ` · hoje ${casa.hoje}` : "")
    : [casa.endereco, casa.cidade && `${casa.cidade}/${casa.uf}`].filter(Boolean).join(" · ");
  $("#rodape").textContent =
    [casa.endereco, casa.cidade && `${casa.cidade}/${casa.uf}`].filter(Boolean).join(" · ");

  montarContato();
  montarPortaDeContato();
}

/* 🔑 O contato é o ÚLTIMO item da lista, como no protótipo. Com número
   cadastrado ele abre o WhatsApp direto; sem, leva à tela com o que existe. */
function montarPortaDeContato() {
  const zap = zapDeContato();
  const porta = document.createElement(zap ? "a" : "button");
  porta.className = "item";
  if (zap) {
    porta.href = zap;
    porta.target = "_blank";
    porta.rel = "noopener";
  } else {
    porta.dataset.ir = "contato";
  }
  // ⚠️ Só o rótulo: o subtítulo dizia o que o botão faz, e o botão já diz.
  porta.textContent = "Entre em Contato";
  $("#itens").appendChild(porta);
}

/**
 * A tela de contato só aparece quando NÃO há WhatsApp cadastrado — com número,
 * o item da página inicial abre a conversa direto.
 *
 * ⚠️ **Aqui os dados NÃO viram `.item`.** Aquele botão é centralizado e só
 * rótulo, por decisão do dono; telefone, e-mail e endereço são conteúdo, e
 * conteúdo centralizado sem rótulo vira adivinhação.
 */
function montarContato() {
  const l = [];
  const zap = zapDeContato();
  if (zap) {
    l.push(`<a class="item" href="${zap}" target="_blank" rel="noopener">WhatsApp</a>`);
  } else {
    // ⚠️ **Sem número cadastrado, o site DIZ isso** em vez de mostrar um botão
    // que não leva a lugar nenhum. O número sai de Administração ▸ Empresa.
    l.push(`<div class="regras ruim">O WhatsApp ainda não está cadastrado. Quem cuida do
      sistema pode preenchê-lo em Administração ▸ Empresa, e ele aparece aqui na hora.</div>`);
  }
  const linha = (rot, valor, href) => `<p class="dado"><span>${rot}</span>${href
    ? `<a href="${href}">${valor}</a>` : valor}</p>`;
  if (casa.telefone) l.push(linha("Telefone", esc(casa.telefone), `tel:${esc(casa.telefone)}`));
  if (casa.email) l.push(linha("E-mail", esc(casa.email), `mailto:${esc(casa.email)}`));
  if (casa.endereco) {
    l.push(linha("Onde estamos", esc(casa.endereco)
      + (casa.cidade ? " — " + esc(casa.cidade) + "/" + esc(casa.uf) : "")));
  }
  $("#bloco-contato").innerHTML = l.join("");
}

/* ---- os cardápios, na PÁGINA INICIAL ---- */
async function carregarCatalogos() {
  let lista = [];
  try {
    lista = await pedir("/catalogos");
  } catch {
    return;
  }
  if (!lista.length) return;
  // ⚠️ Entram DEPOIS do "Reservar" e ANTES do contato — a ordem da lista é a
  // ordem de importância, e reservar é o que a casa quer que aconteça.
  const contato = $("#itens").querySelector("a.item, button.item[data-ir='contato']");
  lista.forEach((c) => {
    const a = document.createElement("a");
    a.className = "item";
    // 🔑 **Clicar ABRE o catálogo** — o PDF, em outra aba. Era uma tela
    // intermediária com uma lista dentro; agora é um toque.
    a.href = `${API}${c.arquivo_url}`;
    a.target = "_blank";
    a.rel = "noopener";
    // ⚠️ **O nome do catálogo, e só ele.** A data de fim e o "abrir o PDF"
    // eram o texto que não era necessário — quem toca num botão chamado
    // "Catálogo de Encomendas" sabe o que vai abrir.
    a.textContent = c.nome;
    if (contato) $("#itens").insertBefore(a, contato);
    else $("#itens").appendChild(a);
  });
}

/* ---- quem reserva ----
 *
 * 🔑 **Pedido do dono (21/09/2026):** *"para a realização de reserva, precisamos
 * de um cadastro simples do usuário. Clica em Reserve sua Mesa, abre uma tela
 * com o número do telefone; caso não tenha cadastrada, realiza o cadastro com
 * Nome, telefone, gênero e cidade."*
 *
 * ⚠️ **O site NÃO guarda quem é a pessoa entre visitas.** Nada de localStorage:
 * um celular emprestado marcaria a mesa no nome de quem o emprestou. O telefone
 * é redigitado, e é ele que identifica.
 */
let reservaOnline = { aceita: false };
const eu = { telefone: "", nome: "", cadastrado: false };

async function saberSeAceita() {
  try {
    reservaOnline = await pedir("/reserva");
  } catch {
    reservaOnline = { aceita: false };
  }
}

function avisar(onde, texto, ruim = true) {
  const caixa = $(onde);
  caixa.hidden = !texto;
  caixa.className = ruim ? "regras ruim" : "regras";
  // ⚠️ Dentro de um `<span>`: `.regras` é flex em coluna, e texto solto vira um
  // item por trecho — a frase sairia quebrada em pedaços empilhados.
  caixa.innerHTML = "";
  if (texto) {
    const linha = document.createElement("span");
    linha.textContent = texto;
    caixa.appendChild(linha);
  }
}

/** O passo em que a tela está: "fone" pergunta o número, "dados" o resto. */
let passo = "fone";

function voltarAoTelefone() {
  passo = "fone";
  $("#bloco-quem").hidden = true;
  $("#bloco-novo").hidden = true;
  $("#avancar").textContent = "Continuar";
  avisar("#aviso-quem", "");
}

async function consultarTelefone() {
  const fone = $("#fone").value.trim();
  if (!fone) return avisar("#aviso-quem", "Digite seu telefone para continuar.");
  $("#avancar").disabled = true;
  let r;
  try {
    r = await pedir("/reserva/telefone", { telefone: fone });
  } catch (e) {
    $("#avancar").disabled = false;
    // ⚠️ **A mensagem do servidor é a que vale** — é ela que sabe dizer que
    // falta o DDD, ou que houve tentativa demais em pouco tempo.
    return avisar("#aviso-quem", e.mensagem || "Não conseguimos consultar agora.");
  }
  $("#avancar").disabled = false;
  eu.telefone = fone;
  eu.cadastrado = !!r.cadastrado;
  passo = "dados";
  $("#bloco-quem").hidden = false;
  // 🔑 **Confirma, não revela** (decisão do dono): quem já tem cadastro vê a
  // dica mascarada e digita o próprio nome para conferir. Sem isso o site seria
  // uma consulta aberta de telefone→nome, sem login nenhum na frente.
  $("#bloco-novo").hidden = eu.cadastrado || !reservaOnline.cadastro_completo;
  avisar("#aviso-quem", eu.cadastrado
    ? `Já temos seu cadastro (${r.dica}). Confirme seu nome para continuar.`
    : "Primeira vez por aqui? Conte quem é você.", false);
  $("#avancar").textContent = "Escolher dia e horário";
  $("#nome-cliente").focus();
}

function guardarDados() {
  const nome = $("#nome-cliente").value.trim();
  if (nome.length < 2) return avisar("#aviso-quem", "Diga seu nome para continuar.");
  if (!$("#bloco-novo").hidden) {
    if (!$("#genero").value) return avisar("#aviso-quem", "Escolha uma opção de gênero.");
    if (!$("#cidade").value.trim()) return avisar("#aviso-quem", "Diga sua cidade.");
  }
  eu.nome = nome;
  eu.genero = $("#bloco-novo").hidden ? null : $("#genero").value;
  eu.cidade = $("#bloco-novo").hidden ? null : $("#cidade").value.trim();
  avisar("#aviso-quem", "");
  ir("reserva");
  buscarHorarios();
}

$("#avancar").addEventListener("click", () => {
  if (passo === "fone") consultarTelefone();
  else guardarDados();
});
// ⚠️ Mudar o telefone depois de consultado volta ao começo: continuar com os
// dados de um número e gravar em outro é o jeito de a mesa sair no nome errado.
$("#fone").addEventListener("input", () => { if (passo === "dados") voltarAoTelefone(); });

/* ---- os horários que a casa tem livres ---- */
let buscando = null;
async function buscarHorarios() {
  const dia = $("#dia").value;
  const pessoas = Number($("#pessoas").value || 0);
  const caixa = $("#horarios");
  const aviso = $("#aviso-reserva");
  aviso.hidden = true;
  if (!dia || !pessoas) {
    caixa.innerHTML = `<span class="vazio">Escolha o dia e quantas pessoas.</span>`;
    return;
  }
  caixa.innerHTML = `<span class="vazio">Procurando mesa…</span>`;
  // ⚠️ A última busca é a que vale: digitar "12" em "pessoas" dispara duas, e
  // sem isto a resposta do "1" podia chegar depois e mandar na tela.
  const minha = Symbol();
  buscando = minha;
  let r;
  try {
    r = await pedir(`/horarios?dia=${dia}&pessoas=${pessoas}`);
  } catch {
    if (buscando !== minha) return;
    caixa.innerHTML = `<span class="vazio">Não conseguimos consultar agora.</span>`;
    return;
  }
  if (buscando !== minha) return;

  if (!r.horarios.length) {
    caixa.innerHTML = `<span class="vazio">Nenhum horário livre.</span>`;
    aviso.hidden = false;
    aviso.textContent = r.motivo || "Não há mesa para este grupo neste dia.";
    return;
  }
  caixa.innerHTML = r.horarios.map((h) =>
    `<button class="hora" type="button" aria-pressed="false">${esc(h)}</button>`).join("");
  if (r.teto && pessoas > r.teto) {
    aviso.hidden = false;
    aviso.innerHTML = `Para <b>${pessoas} pessoas</b> a casa acerta no WhatsApp.`;
  }
}

$("#horarios").addEventListener("click", (e) => {
  const b = e.target.closest(".hora");
  if (!b) return;
  $("#horarios").querySelectorAll(".hora")
    .forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  const aviso = $("#aviso-reserva");
  aviso.hidden = false;
  horaEscolhida = b.textContent;
  const quando = new Date($("#dia").value + "T12:00").toLocaleDateString("pt-BR");

  // 🔑 **Com reserva online, o site GRAVA** — e o botão diz isso.
  if (reservaOnline.aceita) {
    aviso.className = "regras";
    aviso.innerHTML = `<span>Você escolheu <b>${esc(horaEscolhida)}</b>, dia ${esc(quando)}.</span>`;
    $("#confirmar").hidden = false;
    return;
  }

  // ⚠️ **Sem reserva online, a tela NÃO promete o que não faz.** Escolher o
  // horário aqui não grava nada — dizer "reservado" faria o cliente aparecer na
  // porta sem mesa.
  $("#confirmar").hidden = true;
  const zap = linkZap(mensagem(
    casa && casa.zap_texto_reserva,
    `Olá! Queria reservar para {pessoas} pessoas no dia {data} às {hora}.`,
    { casa: casa ? casa.casa : "Botané", pessoas: $("#pessoas").value,
      data: quando, hora: horaEscolhida }));
  // ⚠️ Um `<span>` em volta: `.regras` é flex em coluna, e sem ele o link cai
  // numa linha só dele, separado da frase que o explica.
  aviso.innerHTML = zap
    ? `<span>Você escolheu <b>${esc(horaEscolhida)}</b>. Para confirmar,
       <a href="${zap}" target="_blank" rel="noopener">mande a mensagem pronta ›</a></span>`
    : `<span>Você escolheu <b>${esc(horaEscolhida)}</b>. Ligue para a casa para confirmar.</span>`;
});

/** A hora que a pessoa tocou — o que o "Confirmar" vai gravar. */
let horaEscolhida = null;

$("#confirmar").addEventListener("click", async () => {
  if (!horaEscolhida) return;
  $("#confirmar").disabled = true;
  let feita;
  try {
    feita = await pedir("/reserva", {
      telefone: eu.telefone, nome: eu.nome, genero: eu.genero, cidade: eu.cidade,
      data: $("#dia").value, hora: horaEscolhida,
      pessoas: Number($("#pessoas").value),
    });
  } catch (e) {
    $("#confirmar").disabled = false;
    // ⚠️ **O erro fica NA TELA DO HORÁRIO**, não numa tela de erro: a resposta
    // costuma ser "esse horário acabou de ser tomado", e a pessoa precisa ver a
    // lista para escolher outro.
    avisar("#aviso-reserva", e.mensagem || "Não conseguimos marcar agora.");
    buscarHorarios();
    return;
  }
  $("#confirmar").disabled = false;
  $("#confirmar").hidden = true;
  const quando = new Date(feita.data + "T12:00").toLocaleDateString("pt-BR");
  $("#recibo").innerHTML =
    `<b>${esc(quando)} · ${esc(feita.hora)}</b>
     <span>${feita.pessoas} ${feita.pessoas === 1 ? "pessoa" : "pessoas"},
     em nome de ${esc(feita.nome)}</span>`;
  // 🔑 **O texto muda conforme a casa confirme na hora ou vá olhar depois**
  // (`reserva_config.confirmacao`). Dizer "está reservado" numa casa que
  // confirma à mão seria prometer o que ela ainda não decidiu.
  const zap = zapDeContato();
  $("#aviso-pronto").className = "regras";
  const falar = zap
    ? ` <a href="${zap}" target="_blank" rel="noopener">fale com a gente</a>.` : "";
  $("#aviso-pronto").innerHTML = feita.confirmada
    ? `<span>Sua mesa está reservada. Até lá!${
        zap ? " Precisando mudar alguma coisa," + falar : ""}</span>`
    : `<span>Recebemos seu pedido — a casa confirma em seguida.${
        zap ? " Se preferir adiantar," + falar : ""}</span>`;
  ir("pronto");
});

/* ---- começo ---- */
(function inicio() {
  const hojeIso = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
  const d = new Date();
  d.setDate(d.getDate() + 1);
  $("#dia").value = new Date(d.getTime() - d.getTimezoneOffset() * 60000)
    .toISOString().slice(0, 10);
  $("#dia").min = hojeIso();

  $("#dia").addEventListener("change", buscarHorarios);
  $("#pessoas").addEventListener("input", buscarHorarios);

  // 🔑 **O botão da capa leva a lugares diferentes**, e quem decide é a casa:
  // aceitando reserva online, ele abre a identificação pelo telefone; não
  // aceitando, vai direto aos horários e fecha pelo WhatsApp, como antes.
  // ⚠️ **Sem isso a tela mentiria por um fluxo inteiro**: a pessoa digitaria
  // telefone, nome, gênero e cidade para descobrir no fim que a casa não marca
  // pelo site — e a saída dela seria fechar a página, não pegar o WhatsApp.
  $("#ir-reservar").addEventListener("click", () => {
    if (reservaOnline.aceita) {
      voltarAoTelefone();
      ir("quem");
      $("#fone").focus();
    } else {
      ir("reserva");
      buscarHorarios();
    }
  });

  carregarCasa().then(carregarCatalogos);
  saberSeAceita().then(() => {
    // ⚠️ Quem não marca pelo site continua vendo o aviso de que a mesa se
    // fecha pela conversa; quem marca, não — o rodapé diria o contrário do que
    // o botão logo acima faz.
    $("#voltar-reserva").dataset.ir = reservaOnline.aceita ? "quem" : "inicio";
    const rodape = $("#rodape-reserva");
    rodape.hidden = reservaOnline.aceita;
    if (!reservaOnline.aceita) {
      rodape.innerHTML = `⚠️ <b>Esta é a primeira versão.</b> O site mostra os horários
        que a casa tem livres — para confirmar a mesa, a gente fecha pelo WhatsApp.`;
    }
  });
  buscarHorarios();
  if (location.hash) ir(location.hash.slice(1));
})();
</script>
